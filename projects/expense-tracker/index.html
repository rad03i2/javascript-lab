<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker · JavaScript Lab</title><link rel="stylesheet" href="style.css"></head><body><main><header><p class="eyebrow">JavaScript Lab</p><h1>Expense Tracker</h1><p>Private, local-first expense tracking in your browser.</p></header><section class="card"><form id="expense-form"><label>Description<input name="description" maxlength="80" required placeholder="Groceries"></label><label>Category<input name="category" maxlength="40" required placeholder="Food"></label><label>Amount<input name="amount" type="number" min="0.01" step="0.01" required placeholder="25.00"></label><button>Add expense</button></form></section><section class="card"><div class="toolbar"><label>Filter <select id="category-filter"><option value="all">All categories</option></select></label><strong>Total: <span id="total">$0.00</span></strong></div><ul id="expense-list" aria-live="polite"></ul></section><footer>Data stays in this browser · Radwan Abdulhadi Ahmed · @rad03i2</footer></main><script type="module" src="app.js"></script></body></html>
